name: Build macOS app
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test BLE protocol
        run: swift test --package-path MacroPadApp
      - name: Build and sign
        run: ./MacroPadApp/build.sh
      - name: Package
        run: ditto -c -k --sequesterRsrc --keepParent MacroPadApp/dist/MacroPad.app MacroPad.zip
      - uses: actions/upload-artifact@v4
        with:
          name: MacroPad-macOS
          path: MacroPad.zip
